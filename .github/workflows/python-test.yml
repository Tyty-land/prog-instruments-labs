name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install pytest
        pip install pandas
        pip install opencv-python-headless
        pip install matplotlib
        pip install numpy

    - name: Run tests
      run: |
        python -m pytest lab_6/unit_tests/ -v